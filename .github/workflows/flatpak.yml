name: Flatpak

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated Cargo sources
        run: |
          python3 scripts/generate-cargo-sources.py -o /tmp/cargo-sources.json
          diff -u flatpak/cargo-sources.json /tmp/cargo-sources.json

      - name: Reject production host permissions
        run: python3 scripts/check-production-manifest.py --self-test

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: pinpoint.flatpak
          manifest-path: com.nedrichards.pinpoint.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

name: Flatpak

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      # The upstream actions-images project currently publishes GNOME 50 as
      # its newest GNOME builder image. flatpak-builder still installs the
      # manifest-declared GNOME 51 SDK/runtime from Flathub below.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify generated Cargo sources
        run: |
          python3 scripts/generate-cargo-sources.py -o /tmp/cargo-sources.json
          diff -u flatpak/cargo-sources.json /tmp/cargo-sources.json

      - name: Reject production host permissions
        run: python3 scripts/check-production-manifest.py --self-test

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Pinpoint-Rust-Devel-${{ github.sha }}-x86_64.flatpak
          manifest-path: com.nedrichards.pinpoint.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          keep-build-dirs: true
          upload-artifact: false

      - name: Upload development bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Pinpoint-Rust-Devel-${{ github.sha }}-x86_64
          path: Pinpoint-Rust-Devel-${{ github.sha }}-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Summarize development bundle
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### Development Flatpak'
            echo "Download: ${ARTIFACT_URL}"
            echo "Built checkout: ${GITHUB_SHA}"
            echo "PR head: ${PR_HEAD}"
            echo 'Retention: 14 days'
            echo 'Install after extracting the artifact:'
            echo '```console'
            echo "flatpak install --user ./Pinpoint-Rust-Devel-${GITHUB_SHA}-x86_64.flatpak"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Flatpak test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-test-logs-${{ github.sha }}
          path: .flatpak-builder/build/**/meson-logs/testlog.*
          if-no-files-found: warn
          retention-days: 14

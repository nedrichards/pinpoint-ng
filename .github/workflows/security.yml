name: Security

permissions:
  contents: read

on:
  push:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - deny.toml
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - deny.toml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    permissions:
      checks: write
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational advisories inherited by transitive GNOME/image crates:
          # fxhash via librsvg -> selectors; paste via glycin-common.
          # Keep them ignored: no supported first-party remediation exists, and
          # this prevents scheduled audits from reopening their tracking issues.
          ignore: RUSTSEC-2025-0057,RUSTSEC-2024-0436

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          rust-version: '1.97.0'
          command: check bans licenses sources

[workspace]
members = ["pinpoint-core", "pinpoint"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LGPL-2.1-or-later"
rust-version = "1.97"
version = "0.3.0"
authors = ["Nick Richards"]
repository = "https://github.com/nedrichards/pinpoint-ng"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_50"] }
sourceview = { package = "sourceview5", version = "0.11.2", features = ["v5_4"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9", "gtk_v4_22"] }
glycin = { version = "3.1.0", features = ["gdk4"] }
gst = { package = "gstreamer", version = "0.25.3", features = ["v1_26"] }
rsvg = { package = "librsvg", version = "2.62.3" }
cairo-rs = { version = "0.22.9", features = ["pdf", "png"] }
pangocairo = "0.22.9"
async-signal = "0.2.13"
futures-lite = "2.6.1"
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
